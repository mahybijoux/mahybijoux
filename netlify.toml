# Netlify detects Next.js automatically and applies its Next.js runtime.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # These two values are public by design (sent to every browser; data is protected by
  # Supabase Row-Level Security). Never put a service_role / secret key in NEXT_PUBLIC_*.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
